{
  "schemaVersion": 1,
  "runtimeRole": {
    "roleId": "privateProRuntime",
    "title": "Private Pro Firebase runtime",
    "description": "Mounted Private Pro Auth and Firestore account bootstrap calls only.",
    "stage": "GA",
    "includedPermissions": [
      "datastore.databases.get",
      "datastore.entities.create",
      "datastore.entities.get",
      "datastore.entities.update",
      "firebaseauth.users.get",
      "firebaseauth.users.update"
    ]
  },
  "localVerification": [
    {
      "operation": "firebase-id-token",
      "requiredIamPermissions": []
    },
    {
      "operation": "firebase-app-check-token",
      "requiredIamPermissions": []
    }
  ],
  "workloadIdentityBinding": {
    "role": "roles/iam.workloadIdentityUser",
    "serviceAccount": "${RUNTIME_SERVICE_ACCOUNT_EMAIL}",
    "members": [
      "${WIF_RUNTIME_PRINCIPAL}"
    ],
    "scope": "runtime-service-account-only"
  },
  "validation": {
    "status": "unverified",
    "liveValidationTask": 21,
    "provisioningApprovalTask": 24,
    "notes": "Provisioning and protected staging probes require explicit approval. Do not mutate IAM from this manifest automatically."
  }
}
